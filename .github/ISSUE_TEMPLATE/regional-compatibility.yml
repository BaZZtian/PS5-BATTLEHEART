name: Regional compatibility report
description: Share local disc metadata or a real PS5 test without game files.
title: "[Region] Game / disc ID / revision"
body:
  - type: markdown
    attributes:
      value: |
        We need NTSC-U owners and compatibility contributors. There are no playable PS5 builds yet.
        Do not upload ISOs, original executables, extracted files, shaders, private paths or download links.
        Share only reviewed metadata, sanitized results, or your own code.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Sonic Adventure 2 Battle (GameCube)
    validations:
      required: true
  - type: dropdown
    id: evidence-type
    attributes:
      label: What did you actually test?
      options:
        - Local ISO structure only (not gameplay)
        - Physical PS5 gameplay (requires a playable local build)
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Reviewed metadata.json
      description: Paste metadata.json, never input.json. Disc ID, revision and SHA-256 are required.
      render: json
    validations:
      required: true
  - type: textarea
    id: gameplay
    attributes:
      label: PS5 evidence, if available
      description: Exact build ID, firmware, date, test route, required checks and sanitized evidence reference. Otherwise write not tested.
  - type: textarea
    id: result
    attributes:
      label: Result or compatibility issue
      description: Include sanitized errors and reproducible steps. Review logs for private paths before sharing.
    validations:
      required: true
  - type: checkboxes
    id: contribution-scope
    attributes:
      label: Submission review
      options:
        - label: I have not attached original game files, extracted content, download links or private input manifests.
          required: true
        - label: I distinguish local structure checks from real PS5 gameplay tests.
          required: true
